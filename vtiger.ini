memory_limit = 512M
max_execution_time = 0
max_input_time = 0
max_input_vars = 10000
file_uploads = On
upload_max_filesize = 64M
post_max_size = 64M
output_buffering = 4096
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ERROR & ~E_NOTICE & ~E_STRICT & ~E_DEPRECATED
date.timezone = UTC
session.cookie_httponly = 1
