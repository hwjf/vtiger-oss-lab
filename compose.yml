name: vtiger-oss-lab

x-db: &db
  image: mariadb:10.11.14@sha256:dbe56e20372fc6d6b8e0e396866ba89c4c7f128c38c4f59aaa54d957db95790c
  command:
    - --default-storage-engine=InnoDB
    - --character-set-server=utf8
    - --collation-server=utf8_general_ci
    - --local-infile=1
    - --sql-mode=NO_ENGINE_SUBSTITUTION
  environment:
    MARIADB_DATABASE: vtiger
    MARIADB_USER: vtiger
    MARIADB_PASSWORD: vtiger-lab-db
    MARIADB_ROOT_PASSWORD: vtiger-lab-root
  healthcheck:
    test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
    interval: 5s
    timeout: 5s
    retries: 60
  networks: [lab]

x-vtiger: &vtiger
  environment: &vtiger-environment
    VTIGER_DB_USER: vtiger
    VTIGER_DB_PASSWORD: vtiger-lab-db
    VTIGER_DB_NAME: vtiger
    VTIGER_ADMIN_PASSWORD: vtiger-lab-admin
    VTIGER_ACCESS_KEY: vtiger-lab-access-key
  networks: [lab]
  restart: unless-stopped

services:
  db80:
    <<: *db
    volumes: [db80:/var/lib/mysql]
  vtiger80:
    <<: *vtiger
    build:
      context: .
      args:
        VTIGER_VERSION: 8.0.0
        VTIGER_SHA256: 4ee95c6746306e0d23b2a50f061085e09856652ad23229049e3245f0abd7225b
    image: local/vtiger-oss-lab:8.0.0
    environment:
      <<: *vtiger-environment
      VTIGER_DB_HOST: db80
      VTIGER_PUBLIC_PORT: 8180
    depends_on:
      db80: { condition: service_healthy }
    ports: ['127.0.0.1:8180:80']
    volumes: [app80:/var/www/html]
    healthcheck:
      test:
        [
          CMD-SHELL,
          'test -f /var/www/html/.lab-install-complete && curl -fsS http://127.0.0.1/index.php >/dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 120

  db81:
